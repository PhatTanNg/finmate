<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f7" />
    <meta name="description" content="FinMate — cố vấn tài chính cá nhân: theo dõi thu chi tự động, phân bổ quỹ, đa tiền tệ VND/EUR." />
    <meta name="color-scheme" content="light dark" />
    <title>FinMate — Cố vấn tài chính cá nhân</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- iOS KHÔNG đọc được SVG cho apple-touch-icon: để SVG ở đây thì cài vào
         màn hình chính iPhone sẽ ra icon trống. Phải là PNG, và nên vuông tràn
         viền vì iOS tự bo góc — đưa ảnh bo sẵn vào sẽ bị bo hai lần. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-sq-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Cài lên màn hình chính iPhone/Android như một app: chạy toàn màn hình, không thanh địa chỉ. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FinMate" />
    <script>
      // Đặt chủ đề trước khi React chạy để không bị chớp nền sáng/tối.
      (function () {
        try {
          var m = localStorage.getItem('finmate.theme') || 'auto';
          var real = m === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : m;
          document.documentElement.setAttribute('data-theme', real);
          document.documentElement.style.colorScheme = real;
        } catch (e) { /* chế độ riêng tư */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
