<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="FinMate — cố vấn tài chính cá nhân: theo dõi thu chi tự động, phân bổ quỹ, đa tiền tệ VND/EUR." />
    <meta name="color-scheme" content="dark light" />
    <title>FinMate — Cố vấn tài chính cá nhân</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>" />
    <script>
      // Đặt chủ đề trước khi React chạy để không bị chớp nền sáng/tối.
      (function () {
        try {
          var m = localStorage.getItem('finmate.theme') || 'auto';
          var real = m === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : m;
          document.documentElement.setAttribute('data-theme', real);
          document.documentElement.style.colorScheme = real;
        } catch (e) { /* chế độ riêng tư */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
