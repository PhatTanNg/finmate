# Dựng máy chủ FinMate trên Fly.io — bấm từ trình duyệt, kể cả trên điện thoại.
#
# Vì sao có workflow này: `fly deploy` cần flyctl, tức là cần một cái máy có
# terminal. Nhiều người (chủ nhân repo này chẳng hạn) chỉ có iPhone trong tay.
# GitHub Actions thì có sẵn máy Linux, nên mọi lệnh flyctl chạy ở đây — người
# dùng chỉ cần bấm "Run workflow" trong tab Actions.
#
# CHUẨN BỊ (làm một lần, đều bằng trình duyệt):
#   1. Tạo tài khoản tại https://fly.io/app/sign-up
#   2. Lấy token: https://fly.io/user/personal_access_tokens -> Create token
#   3. Repo này -> Settings -> Secrets and variables -> Actions -> New secret:
#        FLY_API_TOKEN     = token vừa lấy                        (bắt buộc)
#        FINMATE_SIGNUP_CODE = mã mời tự đặt, để người lạ không đăng ký được
#        FINMATE_MAIL_KEY  = khoá Resend, nếu muốn "quên mật khẩu" tự gửi thư
#        FINMATE_LLM_KEY   = khoá Claude, nếu muốn bao cả nhà dùng chung
#   4. Actions -> "Dựng máy chủ (Fly.io)" -> Run workflow
#
# Workflow này KHÔNG tự chạy khi push: dựng máy chủ và đổi bí mật là việc phải
# do người bấm, không phải hệ quả phụ của một lần sửa mã.
name: Dựng máy chủ (Fly.io)

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Tên app trên Fly (phải là duy nhất toàn cầu, chữ thường và dấu gạch ngang)'
        required: true
      region:
        description: 'Đặt máy ở đâu: sin (Singapore, gần VN nhất) · nrt (Tokyo) · fra (Frankfurt) · iad (Mỹ)'
        required: true
        default: sin
      volume_gb:
        description: 'Dung lượng ổ đĩa giữ dữ liệu (GB). 3 là thoải mái cho nhiều năm.'
        required: true
        default: '3'

# Chỉ một lần deploy chạy tại một thời điểm — hai lần cùng lúc có thể tạo hai
# ổ đĩa, mà SQLite thì chỉ được một máy ghi.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy lên Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Chuẩn hoá token Fly
        env:
          RAW: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$RAW" ]; then
            echo "::error::Chưa có secret FLY_API_TOKEN. Lấy token ở https://fly.io/user/personal_access_tokens rồi thêm vào Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Copy token trên điện thoại gần như luôn dính thêm dấu xuống dòng hoặc
          # khoảng trắng ở đầu/cuối. Ký tự xuống dòng thì KHÔNG đặt vào header
          # HTTP được, nên flyctl chết với một câu chẳng liên quan gì tới token:
          # 'net/http: invalid header field value for "Authorization"'.
          # Cắt ở đây một lần cho xong, thay vì bắt người ta copy lại cho chuẩn.
          #
          # Chỉ cắt hai đầu: token Fly có dạng "FlyV1 fm2_..." — dấu cách Ở GIỮA
          # là một phần của token, đụng vào là hỏng.
          CLEAN=$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          # Ô hiện token trên trang Fly ngắt dòng cho vừa màn hình. Chọn tay trên
          # điện thoại thì mỗi chỗ ngắt có thể thành một KHOẢNG TRẮNG nằm giữa
          # thân token — cắt hai đầu không đụng tới nó, và token vẫn hỏng.
          # Phần sau "FlyV1 " là base64url, không bao giờ chứa khoảng trắng, nên
          # bỏ sạch khoảng trắng bên trong là an toàn. Giữ nguyên đúng một dấu
          # cách sau FlyV1 vì nó là một phần của token.
          case "$CLEAN" in
            "FlyV1 "*) CLEAN="FlyV1 $(printf '%s' "${CLEAN#FlyV1 }" | tr -d '[:space:]')" ;;
            *)         CLEAN=$(printf '%s' "$CLEAN" | tr -d '[:space:]') ;;
          esac
          echo "::add-mask::$CLEAN"
          echo "FLY_API_TOKEN=$CLEAN" >> "$GITHUB_ENV"

          echo "Độ dài: ${#RAW} ký tự khi dán vào -> ${#CLEAN} sau khi dọn."
          [ "${#RAW}" -ne "${#CLEAN}" ] && echo "  (đã bỏ $(( ${#RAW} - ${#CLEAN} )) ký tự trắng/xuống dòng)"
          # Ký tự lạ là dấu hiệu copy dính thêm thứ khác (dấu ngoặc, chữ trong
          # giao diện, dấu ... của phần bị cắt ngắn).
          LA=$(printf '%s' "${CLEAN#FlyV1 }" | tr -d 'A-Za-z0-9_,=-' | wc -c)
          if [ "$LA" -gt 1 ]; then
            echo "::warning::Trong token có $((LA - 1)) ký tự không thuộc bảng chữ của token Fly — nhiều khả năng lúc copy đã dính thêm thứ gì đó."
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Token có thật sự dùng được không
        run: |
          # Hỏi Fly xem token này là của ai. Bước này tồn tại vì thông điệp lỗi
          # gốc của flyctl khi token hỏng ("You must be authenticated to view
          # this") không nói được token sai ở đâu — mà người dán token thì không
          # nhìn thấy nó nữa để tự soi.
          # CẢNH BÁO chứ không chặn: token kiểu "deploy token" của một app vẫn
          # deploy được nhưng không có danh tính người dùng, nên whoami luôn
          # hỏng. Để bước tạo app phán quyết, đừng chặn oan ở đây.
          if flyctl auth whoami; then
            echo "Token hợp lệ."
          else
            echo "::warning::Fly chưa nhận ra người dùng của token này."
            # Soi ĐỊNH DẠNG chứ không in giá trị. Ba lỗi hay gặp, theo thứ tự:
            case "$FLY_API_TOKEN" in
              FlyV1*) echo "  · Định dạng FlyV1 — đúng kiểu. Vậy nhiều khả năng token đã bị thu hồi, hết hạn, hoặc tài khoản Fly chưa xác minh xong (vào https://fly.io/dashboard xem có đòi thêm bước nào không)." ;;
              fm2_*)  echo "  · Chuỗi bắt đầu bằng fm2_ — đây là phần ĐUÔI của token. Fly hiện token đầy đủ dạng 'FlyV1 fm2_...'; phải copy CẢ chữ FlyV1 và dấu cách ở đầu." ;;
              "")     echo "  · Secret rỗng." ;;
              *)      echo "  · Không phải định dạng token của Fly. Có thể bạn dán nhầm thứ khác, hoặc chỉ copy được một phần." ;;
            esac
            echo "  · Độ dài chuỗi đã dán: ${#FLY_API_TOKEN} ký tự (token Fly thường dài hơn 80)."
            echo "  · Nếu bước tạo app phía dưới cũng hỏng: tạo token MỚI ở https://fly.io/user/personal_access_tokens (token của TÀI KHOẢN, không phải deploy token của một app), và dán bằng nút copy của trang thay vì bôi đen bằng tay."
          fi

      - name: Tạo app nếu chưa có
        env:
          APP: ${{ inputs.app }}
        run: |
          if flyctl status --app "$APP" >/dev/null 2>&1; then
            echo "App $APP đã có, dùng lại."
          else
            # Tổ chức không phải lúc nào cũng tên "personal" (tài khoản tạo qua
            # một tổ chức khác chẳng hạn), nên hỏi Fly xem token này thuộc tổ
            # chức nào rồi dùng đúng cái đó.
            ORG=$(flyctl orgs list --json | jq -r 'if type == "object" then (keys[0] // empty) else (.[0].Slug // .[0].slug // empty) end')
            ORG=${ORG:-personal}
            echo "Tạo app $APP trong tổ chức $ORG…"
            if ! out=$(flyctl apps create "$APP" --org "$ORG" 2>&1); then
              echo "$out"
              # Hai lời từ chối hay gặp nhất, và cách xử lý hoàn toàn khác nhau —
              # đọc lẫn trong log thì dễ tưởng là code hỏng.
              case "$out" in
                *"payment information"*|*"Add a credit card"*)
                  echo "::error::Fly đòi thông tin thanh toán trước khi tạo app. Vào https://fly.io/dashboard/$ORG/billing gắn thẻ (hoặc mua credit), rồi bấm Run workflow lại. Không phải lỗi token hay lỗi code."
                  ;;
                *"already"*|*"taken"*|*"unavailable"*)
                  echo "::error::Tên app \"$APP\" đã có người lấy — tên app trên Fly là duy nhất toàn cầu. Chạy lại với một tên khác."
                  ;;
                *"must be authenticated"*|*"Unauthorized"*)
                  echo "::error::Token không có quyền tạo app trong tổ chức. Hai đường đi tiếp:"
                  echo "  (a) Tạo app bằng tay: vào https://fly.io/dashboard -> Launch/Create app, đặt tên \"$APP\", rồi chạy lại workflow này. Workflow thấy app có sẵn sẽ bỏ qua bước tạo, và deploy token của chính app đó là đủ dùng."
                  echo "  (b) Lấy token TÀI KHOẢN mới ở https://fly.io/user/personal_access_tokens (đặt hạn dùng dài, phạm vi tổ chức personal) rồi dán lại vào secret FLY_API_TOKEN."
                  ;;
                *)
                  echo "::error::Không tạo được app. Nguyên văn lời Fly nói ở ngay trên."
                  ;;
              esac
              exit 1
            fi
            echo "$out"
          fi

      - name: Tạo ổ đĩa giữ dữ liệu nếu chưa có
        env:
          APP: ${{ inputs.app }}
          REGION: ${{ inputs.region }}
          GB: ${{ inputs.volume_gb }}
        run: |
          # Ổ đĩa là thứ giữ toàn bộ sổ sách qua mỗi lần deploy. Không có nó thì
          # mỗi lần deploy lại là mất sạch — nên tạo trước khi deploy lần đầu.
          # flyctl từng đổi cách viết hoa khoá JSON giữa các đời, nên nhận cả hai.
          if flyctl volumes list --app "$APP" --json | jq -e 'any(.[]; (.name // .Name) == "finmate_data")' >/dev/null; then
            echo "Ổ đĩa finmate_data đã có, giữ nguyên."
          else
            flyctl volumes create finmate_data --app "$APP" --region "$REGION" --size "$GB" --yes
          fi

      - name: Đặt các bí mật (chỉ đặt cái nào chưa có)
        env:
          APP: ${{ inputs.app }}
          SIGNUP_CODE: ${{ secrets.FINMATE_SIGNUP_CODE }}
          MAIL_KEY: ${{ secrets.FINMATE_MAIL_KEY }}
          MAIL_FROM: ${{ secrets.FINMATE_MAIL_FROM }}
          LLM_KEY: ${{ secrets.FINMATE_LLM_KEY }}
        run: |
          co() { flyctl secrets list --app "$APP" --json | jq -e --arg k "$1" 'any(.[]; (.name // .Name) == $k)' >/dev/null 2>&1; }
          dat() {
            # Đặt bí mật mà KHÔNG in giá trị ra log. Mỗi lần đặt là Fly khởi động
            # lại máy, nên chỉ đặt khi thật sự có thay đổi.
            if co "$1"; then echo "$1: đã có, giữ nguyên."; else
              echo "$1: đặt mới."
              flyctl secrets set "$1=$2" --app "$APP" --stage
            fi
          }

          # Token webhook: bắt buộc phải có, và phải giữ nguyên qua các lần deploy
          # (Shortcut trên điện thoại đang dùng nó). Sinh ngẫu nhiên ở lần đầu.
          if co FINMATE_INGEST_TOKEN; then
            echo "FINMATE_INGEST_TOKEN: đã có, giữ nguyên."
          else
            flyctl secrets set "FINMATE_INGEST_TOKEN=$(openssl rand -hex 24)" --app "$APP" --stage
          fi

          [ -n "$SIGNUP_CODE" ] && dat FINMATE_SIGNUP_CODE "$SIGNUP_CODE" || echo "Chưa đặt FINMATE_SIGNUP_CODE — ai biết địa chỉ cũng đăng ký được. Nên đặt."
          [ -n "$MAIL_KEY" ] && dat FINMATE_MAIL_KEY "$MAIL_KEY" || true
          [ -n "$MAIL_FROM" ] && dat FINMATE_MAIL_FROM "$MAIL_FROM" || true
          [ -n "$LLM_KEY" ] && dat FINMATE_LLM_KEY "$LLM_KEY" || true

          # Địa chỉ công khai để dán vào thư đặt lại mật khẩu.
          dat FINMATE_PUBLIC_URL "https://$APP.fly.dev"

      - name: Deploy
        env:
          APP: ${{ inputs.app }}
          REGION: ${{ inputs.region }}
        run: |
          # Nơi đặt máy đọc từ fly.toml chứ không phải cờ dòng lệnh — ghi vùng
          # người dùng chọn vào đó (chỉ trong bản checkout của lần chạy này).
          sed -i "s/^primary_region = .*/primary_region = '$REGION'/" fly.toml
          grep '^primary_region' fly.toml
          # --ha=false: CHỈ MỘT MÁY. SQLite cho đúng một tiến trình ghi, và một ổ
          # đĩa Fly cũng chỉ gắn được vào một máy — hai máy là hỏng dữ liệu.
          # --remote-only: build bằng máy dựng của Fly, khỏi phụ thuộc Docker của runner.
          # Khoá máy (lease): sau khi tạo app trên dashboard, hoặc sau một lần
          # deploy dở, Fly còn giữ khoá trên máy vài phút. Deploy lúc đó chết
          # ngay với "failed to acquire lease" — không phải hỏng gì, chỉ là tới
          # sớm. Khoá tự hết hạn, nên chờ rồi thử lại là xong; bắt người ta ngồi
          # canh đồng hồ rồi bấm lại thì vô lý.
          for lan in 1 2 3 4 5 6; do
            if out=$(flyctl deploy --app "$APP" --ha=false --remote-only 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            case "$out" in
              *"lease"*|*"currently held"*)
                if [ "$lan" -lt 6 ]; then
                  echo "Máy đang bị khoá bởi một thao tác khác (thường là trang dashboard vừa tạo app). Chờ 60 giây rồi thử lại — lần $lan/6."
                  sleep 60
                  continue
                fi
                echo "::error::Máy vẫn bị khoá sau 6 lần chờ. Vào https://fly.io/apps/$APP/monitoring xem có thao tác nào đang chạy dở không, đợi nó xong rồi chạy lại workflow."
                ;;
              *"insufficient"*|*"capacity"*)
                echo "::error::Vùng $REGION đang hết chỗ. Chạy lại với vùng khác (nrt = Tokyo, hkg = Hong Kong)."
                ;;
              *)
                echo "::error::Deploy hỏng. Nguyên văn lời Fly nói ở ngay trên."
                ;;
            esac
            exit 1
          done

      - name: Kiểm tra máy chủ đã sống
        env:
          APP: ${{ inputs.app }}
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS "https://$APP.fly.dev/api/health" 2>/dev/null) && break
            sleep 5
          done
          if [ -z "$body" ]; then
            echo "::error::Máy chủ chưa trả lời sau 150 giây. Xem log: flyctl logs --app $APP, hoặc tab Monitoring trên fly.io."
            exit 1
          fi
          echo "$body" | jq .
          echo "$body" | jq -e '.multi_user == true' >/dev/null \
            || echo "::warning::Máy chủ đang chạy chế độ MỘT SỔ. fly.toml phải có FINMATE_MULTIUSER=1."

      - name: Máy chủ không lên thì lấy log của chính nó
        if: failure()
        env:
          APP: ${{ inputs.app }}
        run: |
          # Không có bước này thì mọi trục trặc lúc khởi động đều hiện ra y hệt
          # nhau: "chưa trả lời sau 150 giây" — không nói được app chết vì sao.
          echo "===== Trạng thái máy ====="
          flyctl status --app "$APP" || true
          echo "===== Ổ đĩa ====="
          flyctl volumes list --app "$APP" || true
          echo "===== Log của app (những dòng cuối) ====="
          flyctl logs --app "$APP" --no-tail || true

      - name: Chỉ đường cho người vừa bấm
        env:
          APP: ${{ inputs.app }}
        run: |
          {
            echo "## ✅ FinMate đang chạy"
            echo ""
            echo "**Mở app:** https://$APP.fly.dev"
            echo ""
            echo "Trên iPhone: mở bằng **Safari** → nút Chia sẻ → **Thêm vào MH chính**."
            echo ""
            echo "1. Bấm **Chưa có tài khoản? Tạo mới** rồi nhập mã mời bạn đã đặt."
            echo "2. Vào **Cài đặt → Cố vấn AI** dán khoá API của riêng bạn (nếu muốn có AI)."
            echo "3. Vào tab **Tự động hoá** lấy địa chỉ webhook + token cho iOS Shortcuts."
            echo ""
            echo "Chạy lại workflow này bất cứ lúc nào để deploy phiên bản mới — dữ liệu nằm trên ổ đĩa riêng nên không mất."
          } >> "$GITHUB_STEP_SUMMARY"
