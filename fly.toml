# fly.toml app configuration file generated for finmate-phat on 2026-09-06T15:18:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'finmate-phat'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  FINMATE_HOST = '0.0.0.0'
  FINMATE_MAX_USERS = '50'
  FINMATE_MULTIUSER = '1'
  FINMATE_TRUST_PROXY = '1'
  PORT = '4000'

[[mounts]]
  source = 'finmate_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 80
    soft_limit = 40

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
