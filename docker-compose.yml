> FinMate cho một người dùng: một tiến trình, một file SQLite, một volume.
> Không cần database server riêng, không cần Redis, không cần load balancer.

services:
  finmate:
    build: .
    restart: unless-stopped
    ports:
      # Chỉ mở ra localhost của máy chủ. Đặt một reverse proxy có HTTPS
      # (Caddy, nginx, Cloudflare Tunnel) ở trước rồi mới phơi ra Internet —
      # webhook ngân hàng và mã PIN không nên đi qua HTTP trần.
      - "127.0.0.1:4000:4000"
    volumes:
      - finmate-data:/data
    environment:
      # Bắt buộc khi đưa lên Internet: không có token thì ai cũng đẩy được
      # giao dịch giả vào sổ của bạn.
      # node -e "console.log(require('crypto').randomBytes(24).toString('hex'))"
      FINMATE_INGEST_TOKEN: ${FINMATE_INGEST_TOKEN:?can dat FINMATE_INGEST_TOKEN truoc khi deploy}
      # Domain thật của bạn, để trình duyệt khác không gọi được API. Giao diện
      # do chính máy chủ này phục vụ thì luôn được phép, không cần khai ở đây.
      FINMATE_ORIGINS: ${FINMATE_ORIGINS:-}
      # Nhiều người dùng: đặt 1 thì cửa vào là tài khoản (email + mật khẩu),
      # mỗi người một sổ riêng dưới /data/users. Trống = một sổ, khoá bằng PIN.
      FINMATE_MULTIUSER: ${FINMATE_MULTIUSER:-}
      # Mã mời — bắt buộc trên thực tế nếu máy chủ chạm được từ Internet.
      FINMATE_SIGNUP_CODE: ${FINMATE_SIGNUP_CODE:-}
      FINMATE_MAX_USERS: ${FINMATE_MAX_USERS:-}
      # Gửi thư đặt lại mật khẩu. Không có khoá thì chủ máy chủ phát đường dẫn
      # bằng tay: docker compose exec finmate node server/src/scripts/reset_password.js --email ...
      FINMATE_MAIL_KEY: ${FINMATE_MAIL_KEY:-}
      FINMATE_MAIL_FROM: ${FINMATE_MAIL_FROM:-}
      # Địa chỉ app nhìn từ ngoài, để đường dẫn trong thư trỏ đúng chỗ.
      FINMATE_PUBLIC_URL: ${FINMATE_PUBLIC_URL:-}
      # Tuỳ chọn — bật cố vấn AI thật.
      # Bỏ trống MODEL thì app tự chọn: claude-opus-5 với key Claude, gpt-4o-mini với key OpenAI.
      FINMATE_LLM_KEY: ${FINMATE_LLM_KEY:-}
      FINMATE_LLM_MODEL: ${FINMATE_LLM_MODEL:-}
      FINMATE_LLM_URL: ${FINMATE_LLM_URL:-}
      FINMATE_LLM_EFFORT: ${FINMATE_LLM_EFFORT:-}

volumes:
  finmate-data:
